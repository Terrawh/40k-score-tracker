<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game History &middot; 40K Score Tracker</title>
<style>
  :root{
    --bg: #0f1113;
    --panel: #17191c;
    --panel-2: #1e2124;
    --border: #2c2f33;
    --text: #eef0f2;
    --text-dim: #9aa0a6;
    --p1: #c8393f;
    --p1-dim: #4a2023;
    --p2: #3f7fc8;
    --p2-dim: #1f3550;
    --gold: #d4af6a;
    --good: #4caf7a;
    --warn: #e0a94e;
    --radius: 14px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  header{ text-align:center; margin-bottom: 18px; }
  header h1{
    font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase;
    margin: 0 0 4px; font-weight: 800; color: var(--gold);
  }
  header p{ margin:0; color: var(--text-dim); font-size: 0.85rem; }

  .actions{ display:flex; gap: 10px; margin-bottom: 18px; }
  .action{
    flex:1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-weight: 700; font-size: 0.9rem;
    cursor:pointer; letter-spacing: 0.5px; text-transform: uppercase;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .action.danger{ color: var(--p1); border-color: var(--p1-dim); }
  .action:active{ transform: scale(0.98); }

  .empty{
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 40px 20px; text-align:center; color: var(--text-dim); font-size: 0.9rem;
  }

  .games{ display:flex; flex-direction:column; gap: 12px; }
  .game-card{
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; overflow:hidden;
  }
  .game-date{ font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

  .game-score{
    display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap: 10px; margin-bottom: 12px;
  }
  .game-player{ text-align:center; }
  .game-player .pname{ font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.95rem; }
  .game-player .parmy{ font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
  .game-player.winner .pname{ color: var(--gold); }
  .game-player.winner .pname::after{ content: ' \1F451'; font-size: 0.8em; }
  .game-player.p1 .ptotal{ color: var(--p1); }
  .game-player.p2 .ptotal{ color: var(--p2); }
  .game-player .ptotal{ font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height:1.1; margin-top:2px; }
  .game-vs{ color: var(--text-dim); font-size: 0.8rem; font-weight: 700; }
  .game-draw{ text-align:center; color: var(--text-dim); font-size: 0.75rem; margin-bottom: 10px; }

  .round-table{ width:100%; border-collapse: collapse; font-size: 0.72rem; }
  .round-table th, .round-table td{
    padding: 5px 4px; text-align:center; border-top: 1px solid var(--border); color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .round-table th{ color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-top:none; }
  .round-table td.rt{ color: var(--text); font-weight: 700; }

  .remove-game{
    display:block; width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; cursor:pointer;
  }
  .remove-game:active{ transform: scale(0.98); }

  footer{ text-align:center; color: var(--text-dim); font-size: 0.7rem; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Game History</h1>
    <p>Warhammer 40,000 &middot; Past Games</p>
  </header>

  <div class="actions">
    <a class="action" href="index.html">&larr; Back to Scoreboard</a>
    <button class="action danger" id="clearBtn">Clear History</button>
  </div>

  <div id="empty" class="empty" style="display:none;">No completed games yet. Finish a game on the scoreboard to see it here.</div>
  <div class="games" id="games"></div>

  <footer>Games are stored locally on this device.</footer>
</div>

<script>
(function(){
  var HISTORY_KEY = '40k-game-history-v1';
  var gamesEl = document.getElementById('games');
  var emptyEl = document.getElementById('empty');

  function loadHistory(){
    try{
      var raw = localStorage.getItem(HISTORY_KEY);
      var history = raw ? JSON.parse(raw) : [];
      return Array.isArray(history) ? history : [];
    } catch(e){
      return [];
    }
  }

  function saveHistory(history){
    try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e){}
  }

  function formatDate(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function buildGameCard(entry){
    var card = document.createElement('div');
    card.className = 'game-card';

    var date = document.createElement('div');
    date.className = 'game-date';
    date.textContent = formatDate(entry.date);
    card.appendChild(date);

    var score = document.createElement('div');
    score.className = 'game-score';

    var p1 = document.createElement('div');
    p1.className = 'game-player p1' + (entry.winner === 'p1' ? ' winner' : '');
    p1.innerHTML =
      '<div class="pname">' + escapeHtml(entry.name1) + '</div>' +
      (entry.army1 ? '<div class="parmy">' + escapeHtml(entry.army1) + '</div>' : '') +
      '<div class="ptotal">' + entry.total1 + '</div>';

    var vs = document.createElement('div');
    vs.className = 'game-vs';
    vs.textContent = 'VS';

    var p2 = document.createElement('div');
    p2.className = 'game-player p2' + (entry.winner === 'p2' ? ' winner' : '');
    p2.innerHTML =
      '<div class="pname">' + escapeHtml(entry.name2) + '</div>' +
      (entry.army2 ? '<div class="parmy">' + escapeHtml(entry.army2) + '</div>' : '') +
      '<div class="ptotal">' + entry.total2 + '</div>';

    score.appendChild(p1);
    score.appendChild(vs);
    score.appendChild(p2);
    card.appendChild(score);

    if (entry.winner === 'draw'){
      var draw = document.createElement('div');
      draw.className = 'game-draw';
      draw.textContent = 'Draw';
      card.appendChild(draw);
    }

    if (Array.isArray(entry.rounds) && entry.rounds.length){
      var table = document.createElement('table');
      table.className = 'round-table';

      var thead = document.createElement('tr');
      thead.innerHTML = '<th></th>' + entry.rounds.map(function(r, i){ return '<th>R' + (i + 1) + '</th>'; }).join('');
      table.appendChild(thead);

      table.appendChild(buildRow('Primary', entry, 'primary'));
      table.appendChild(buildRow('Secondary', entry, 'secondary'));
      table.appendChild(buildTotalsRow(entry));

      card.appendChild(table);
    }

    var remove = document.createElement('button');
    remove.className = 'remove-game';
    remove.type = 'button';
    remove.textContent = 'Delete this game';
    remove.addEventListener('click', function(){
      if (!confirm('Delete this game from history?')) return;
      var history = loadHistory().filter(function(g){ return g.id !== entry.id; });
      saveHistory(history);
      render();
    });
    card.appendChild(remove);

    return card;
  }

  function buildRow(label, entry, cat){
    var row = document.createElement('tr');
    var cells = '<th>' + label + '</th>';
    entry.rounds.forEach(function(r){
      cells += '<td>' + r.p1[cat] + '&ndash;' + r.p2[cat] + '</td>';
    });
    row.innerHTML = cells;
    return row;
  }

  function buildTotalsRow(entry){
    var row = document.createElement('tr');
    var cells = '<th>Total</th>';
    entry.rounds.forEach(function(r){
      var t1 = r.p1.primary + r.p1.secondary;
      var t2 = r.p2.primary + r.p2.secondary;
      cells += '<td class="rt">' + t1 + '&ndash;' + t2 + '</td>';
    });
    row.innerHTML = cells;
    return row;
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function render(){
    var history = loadHistory().slice().reverse();
    gamesEl.innerHTML = '';
    emptyEl.style.display = history.length ? 'none' : 'block';
    history.forEach(function(entry){
      gamesEl.appendChild(buildGameCard(entry));
    });
  }

  document.getElementById('clearBtn').addEventListener('click', function(){
    if (!confirm('Clear all game history? This cannot be undone.')) return;
    saveHistory([]);
    render();
  });

  render();
})();
</script>
</body>
</html>
