<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>40K Score Tracker</title>
<style>
  :root{
    --bg: #0f1113;
    --panel: #17191c;
    --panel-2: #1e2124;
    --border: #2c2f33;
    --text: #eef0f2;
    --text-dim: #9aa0a6;
    --p1: #c8393f;
    --p1-dim: #4a2023;
    --p2: #3f7fc8;
    --p2-dim: #1f3550;
    --gold: #d4af6a;
    --good: #4caf7a;
    --warn: #e0a94e;
    --radius: 14px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  header{ text-align:center; margin-bottom: 18px; }
  header h1{
    font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase;
    margin: 0 0 4px; font-weight: 800; color: var(--gold);
  }
  header p{ margin:0; color: var(--text-dim); font-size: 0.85rem; }

  .scoreboard{
    display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px;
  }
  .score-card{
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align:center; position: relative; overflow:hidden;
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .score-card.p1{ border-top: 4px solid var(--p1); }
  .score-card.p2{ border-top: 4px solid var(--p2); }
  .score-card.leading{ box-shadow: 0 0 0 2px var(--gold) inset; }
  .score-card input.name{
    width: 100%; background: transparent; border: none; color: var(--text);
    font-size: 1rem; font-weight: 700; text-align:center; text-transform: uppercase;
    letter-spacing: 1px; padding: 4px; border-radius: 8px;
  }
  .score-card input.name:focus{ outline: 1px solid var(--border); background: var(--panel-2); }
  .score-card select.army,
  .score-card input.army-other{
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    font-size: 0.72rem; text-align:center; text-align-last:center; padding: 5px 4px; border-radius: 8px;
    margin-top: 4px;
  }
  .score-card select.army:focus,
  .score-card input.army-other:focus{ outline: 1px solid var(--gold); color: var(--text); }
  .score-card input.army-other{ display:none; text-align: center; }
  .score-card .total{
    font-size: 2.6rem; font-weight: 800; line-height: 1.1; margin: 6px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .score-card.p1 .total{ color: var(--p1); }
  .score-card.p2 .total{ color: var(--p2); }
  .score-card .cap{ font-size: 0.72rem; color: var(--text-dim); }
  .score-card .crown{ position:absolute; top:8px; right:10px; font-size: 1rem; opacity:0; transition: opacity .2s; }
  .score-card.leading .crown{ opacity: 1; }

  .rounds{
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 16px;
  }

  .round-card{ border-bottom: 1px solid var(--border); padding: 10px 12px 12px; }
  .round-card:last-child{ border-bottom: none; }
  .round-card.active{ background: var(--panel-2); }

  .round-head{
    display:flex; justify-content: space-between; align-items:center;
    margin-bottom: 6px; padding: 2px 2px 6px;
  }
  .round-head .rnum{ color: var(--gold); font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
  .round-head .rtotal{ font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .round-head .rtotal .p1t{ color: var(--p1); }
  .round-head .rtotal .p2t{ color: var(--p2); }

  .cat-row{
    display:grid; grid-template-columns: 62px 1fr 1fr; align-items:center; gap: 6px; padding: 4px 0;
  }
  .cat-label{ color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }

  .stepper{
    display:flex; align-items:center; justify-content:center; gap: 6px;
  }
  .stepper button{
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 1rem; font-weight: 700;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    touch-action: manipulation; flex-shrink: 0;
  }
  .round-card .stepper button{ background: #14161a; }
  .stepper button:active{ transform: scale(0.94); }
  .stepper input{
    width: 40px; text-align:center; background: transparent; border: none; color: var(--text);
    font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .stepper input:focus{ outline: none; }
  .stepper.p1 button{ color: var(--p1); }
  .stepper.p2 button{ color: var(--p2); }

  .round-warn{ font-size: 0.65rem; color: var(--warn); text-align:center; margin-top: 2px; }

  .meta{ display:flex; justify-content: space-between; align-items:center; color: var(--text-dim); font-size: 0.8rem; margin: 0 4px 16px; }

  .actions{ display:flex; gap: 10px; }
  .action{
    flex:1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-weight: 700; font-size: 0.9rem;
    cursor:pointer; letter-spacing: 0.5px; text-transform: uppercase;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .action.danger{ color: var(--p1); border-color: var(--p1-dim); }
  .action:active{ transform: scale(0.98); }

  .winner-banner{
    text-align:center; padding: 12px; margin-bottom: 16px; border-radius: var(--radius);
    background: linear-gradient(135deg, var(--panel-2), var(--panel)); border: 1px solid var(--gold);
    color: var(--gold); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; font-size: 0.95rem;
    display:none;
  }
  .winner-banner.show{ display:block; }

  footer{ text-align:center; color: var(--text-dim); font-size: 0.7rem; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Score Tracker</h1>
    <p>Warhammer 40,000 &middot; 11th Edition &middot; 5 Rounds</p>
  </header>

  <div id="winnerBanner" class="winner-banner"></div>

  <div class="scoreboard">
    <div class="score-card p1" id="card1">
      <span class="crown">&#9819;</span>
      <input class="name" id="name1" value="Player 1" maxlength="20">
      <select class="army" id="army1"></select>
      <input class="army-other" id="armyOther1" type="text" placeholder="Enter army name" maxlength="30">
      <div class="total" id="total1">0</div>
      <div class="cap">of 90 VP max</div>
    </div>
    <div class="score-card p2" id="card2">
      <span class="crown">&#9819;</span>
      <input class="name" id="name2" value="Player 2" maxlength="20">
      <select class="army" id="army2"></select>
      <input class="army-other" id="armyOther2" type="text" placeholder="Enter army name" maxlength="30">
      <div class="total" id="total2">0</div>
      <div class="cap">of 90 VP max</div>
    </div>
  </div>

  <div class="meta">
    <span id="roundStatus">Round 1 of 5</span>
    <span>Primary + Secondary &rarr; round total</span>
  </div>

  <div class="rounds" id="roundsContainer"></div>

  <div class="actions">
    <button class="action" id="prevBtn">&larr; Prev Round</button>
    <button class="action" id="nextBtn">Next Round &rarr;</button>
  </div>
  <div class="actions" style="margin-top:10px;">
    <a class="action" id="historyBtn" href="history.html">Game History</a>
    <button class="action danger" id="resetBtn">New Game</button>
  </div>

  <footer>Primary max 15 VP/round &middot; Secondary max 15 VP/round &middot; 90 VP/game (11th Ed. guideline, not enforced)</footer>
</div>

<script>
(function(){
  var ROUNDS = 5;
  var CAT_CAP = 15;    // per player, per round, per category (primary or secondary) — soft guideline
  var GAME_CAP = 90;   // per player, per game — soft guideline

  // 11th edition factions, grouped by grand alliance. If a codex is missing or renamed,
  // "Other / Homebrew" lets a player type any army name instead.
  var FACTIONS = {
    'Imperium': [
      'Adepta Sororitas', 'Adeptus Custodes', 'Adeptus Mechanicus', 'Astra Militarum',
      'Imperial Knights', 'Space Marines', 'Black Templars', 'Dark Angels', 'Deathwatch',
      'Grey Knights', 'Space Wolves'
    ],
    'Chaos': [
      'Chaos Space Marines', 'Chaos Daemons', 'Chaos Knights', 'Death Guard',
      "Emperor's Children", 'Thousand Sons', 'World Eaters'
    ],
    'Xenos': [
      'Aeldari', 'Drukhari', 'Genestealer Cults', 'Leagues of Votann', 'Necrons',
      'Orks', "T'au Empire", 'Tyranids'
    ]
  };

  function makeGameId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  var state = {
    scores: {
      p1: { primary: new Array(ROUNDS).fill(0), secondary: new Array(ROUNDS).fill(0) },
      p2: { primary: new Array(ROUNDS).fill(0), secondary: new Array(ROUNDS).fill(0) }
    },
    activeRound: 0,
    gameOver: false,
    gameId: makeGameId(),
    recorded: false
  };

  var roundsContainer = document.getElementById('roundsContainer');
  var total1El = document.getElementById('total1');
  var total2El = document.getElementById('total2');
  var card1 = document.getElementById('card1');
  var card2 = document.getElementById('card2');
  var roundStatus = document.getElementById('roundStatus');
  var winnerBanner = document.getElementById('winnerBanner');

  var STORAGE_KEY = '40k-scoreboard-v1';
  var HISTORY_KEY = '40k-game-history-v1';
  var HISTORY_LIMIT = 50;

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        scores: state.scores,
        activeRound: state.activeRound,
        gameOver: state.gameOver,
        gameId: state.gameId,
        recorded: state.recorded,
        name1: document.getElementById('name1').value,
        name2: document.getElementById('name2').value,
        army1: document.getElementById('army1').value,
        army2: document.getElementById('army2').value,
        armyOther1: document.getElementById('armyOther1').value,
        armyOther2: document.getElementById('armyOther2').value
      }));
    } catch(e){}
  }

  function armyDisplay(n){
    var select = document.getElementById('army' + n);
    var otherInput = document.getElementById('armyOther' + n);
    if (select.value === 'other') return otherInput.value.trim() || 'Other / Homebrew';
    return select.value || '';
  }

  function recordGameToHistory(){
    if (state.recorded) return;
    var rounds = [];
    for (var i = 0; i < ROUNDS; i++){
      rounds.push({
        p1: { primary: state.scores.p1.primary[i], secondary: state.scores.p1.secondary[i] },
        p2: { primary: state.scores.p2.primary[i], secondary: state.scores.p2.secondary[i] }
      });
    }
    var t1 = grandTotal('p1');
    var t2 = grandTotal('p2');
    var entry = {
      id: state.gameId,
      date: new Date().toISOString(),
      name1: document.getElementById('name1').value || 'Player 1',
      name2: document.getElementById('name2').value || 'Player 2',
      army1: armyDisplay('1'),
      army2: armyDisplay('2'),
      rounds: rounds,
      total1: t1,
      total2: t2,
      winner: t1 === t2 ? 'draw' : (t1 > t2 ? 'p1' : 'p2')
    };
    try{
      var raw = localStorage.getItem(HISTORY_KEY);
      var history = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(history)) history = [];
      history.push(entry);
      if (history.length > HISTORY_LIMIT) history = history.slice(history.length - HISTORY_LIMIT);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      state.recorded = true;
    } catch(e){}
  }

  function restoreArmy(n, army, other){
    if (!army) return;
    var select = document.getElementById('army' + n);
    var otherInput = document.getElementById('armyOther' + n);
    select.value = army;
    if (army === 'other'){
      otherInput.style.display = 'block';
      otherInput.value = other || '';
    }
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!saved || !saved.scores) return;

      ['p1', 'p2'].forEach(function(player){
        ['primary', 'secondary'].forEach(function(cat){
          var arr = saved.scores[player] && saved.scores[player][cat];
          if (Array.isArray(arr)){
            for (var i = 0; i < ROUNDS; i++){
              state.scores[player][cat][i] = clamp(arr[i]);
            }
          }
        });
      });

      state.activeRound = clamp(saved.activeRound);
      if (state.activeRound >= ROUNDS) state.activeRound = ROUNDS - 1;
      state.gameOver = !!saved.gameOver;
      if (saved.gameId) state.gameId = saved.gameId;
      state.recorded = !!saved.recorded;

      if (saved.name1) document.getElementById('name1').value = saved.name1;
      if (saved.name2) document.getElementById('name2').value = saved.name2;

      restoreArmy('1', saved.army1, saved.armyOther1);
      restoreArmy('2', saved.army2, saved.armyOther2);
    } catch(e){}
  }

  function buildArmyDropdown(select){
    var frag = document.createDocumentFragment();

    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Select army…';
    placeholder.disabled = true;
    placeholder.selected = true;
    frag.appendChild(placeholder);

    Object.keys(FACTIONS).forEach(function(group){
      var optgroup = document.createElement('optgroup');
      optgroup.label = group;
      FACTIONS[group].forEach(function(faction){
        var opt = document.createElement('option');
        opt.value = faction;
        opt.textContent = faction;
        optgroup.appendChild(opt);
      });
      frag.appendChild(optgroup);
    });

    var other = document.createElement('option');
    other.value = 'other';
    other.textContent = 'Other / Homebrew…';
    frag.appendChild(other);

    select.appendChild(frag);
  }

  function setupArmyPicker(select, otherInput){
    buildArmyDropdown(select);
    select.addEventListener('change', function(){
      if (select.value === 'other'){
        otherInput.style.display = 'block';
        otherInput.focus();
      } else {
        otherInput.style.display = 'none';
        otherInput.value = '';
      }
      saveState();
    });
    otherInput.addEventListener('input', saveState);
  }

  setupArmyPicker(document.getElementById('army1'), document.getElementById('armyOther1'));
  setupArmyPicker(document.getElementById('army2'), document.getElementById('armyOther2'));
  document.getElementById('name1').addEventListener('input', saveState);
  document.getElementById('name2').addEventListener('input', saveState);

  function clamp(n){
    if (isNaN(n)) return 0;
    n = Math.round(n);
    if (n < 0) return 0;
    if (n > 999) return 999;
    return n;
  }

  function roundTotal(player, idx){
    return state.scores[player].primary[idx] + state.scores[player].secondary[idx];
  }

  function grandTotal(player){
    var t = 0;
    for (var i = 0; i < ROUNDS; i++) t += roundTotal(player, i);
    return t;
  }

  function buildRounds(){
    roundsContainer.innerHTML = '';
    for (var i = 0; i < ROUNDS; i++){
      (function(idx){
        var card = document.createElement('div');
        card.className = 'round-card';
        card.id = 'row-' + idx;

        var head = document.createElement('div');
        head.className = 'round-head';
        var rnum = document.createElement('div');
        rnum.className = 'rnum';
        rnum.textContent = 'Round ' + (idx + 1);
        var rtotal = document.createElement('div');
        rtotal.className = 'rtotal';
        rtotal.id = 'rtotal-' + idx;
        head.appendChild(rnum);
        head.appendChild(rtotal);
        card.appendChild(head);

        card.appendChild(makeCatRow('Primary', 'primary', idx));
        card.appendChild(makeCatRow('Secondary', 'secondary', idx));

        var warn = document.createElement('div');
        warn.className = 'round-warn';
        warn.id = 'warn-' + idx;
        warn.style.display = 'none';
        card.appendChild(warn);

        roundsContainer.appendChild(card);
      })(i);
    }
  }

  function makeCatRow(label, cat, idx){
    var row = document.createElement('div');
    row.className = 'cat-row';

    var labelEl = document.createElement('div');
    labelEl.className = 'cat-label';
    labelEl.textContent = label;

    var s1 = makeStepper('p1', cat, idx);
    var s2 = makeStepper('p2', cat, idx);

    row.appendChild(labelEl);
    row.appendChild(s1);
    row.appendChild(s2);
    return row;
  }

  function makeStepper(player, cat, idx){
    var wrap = document.createElement('div');
    wrap.className = 'stepper ' + player;
    wrap.dataset.player = player;
    wrap.dataset.cat = cat;

    var minus = document.createElement('button');
    minus.type = 'button';
    minus.textContent = '−';
    minus.setAttribute('aria-label', 'decrease');

    var input = document.createElement('input');
    input.type = 'number';
    input.inputMode = 'numeric';
    input.value = state.scores[player][cat][idx];
    input.min = '0';

    var plus = document.createElement('button');
    plus.type = 'button';
    plus.textContent = '+';
    plus.setAttribute('aria-label', 'increase');

    minus.addEventListener('click', function(){
      setScore(player, cat, idx, state.scores[player][cat][idx] - 1);
    });
    plus.addEventListener('click', function(){
      setScore(player, cat, idx, state.scores[player][cat][idx] + 1);
    });
    input.addEventListener('input', function(){
      setScore(player, cat, idx, parseInt(input.value, 10));
    });
    input.addEventListener('focus', function(){
      state.activeRound = idx;
      render();
    });

    wrap.appendChild(minus);
    wrap.appendChild(input);
    wrap.appendChild(plus);
    return wrap;
  }

  function setScore(player, cat, idx, value){
    state.scores[player][cat][idx] = clamp(value);
    render();
    saveState();
  }

  function render(){
    var t1 = grandTotal('p1');
    var t2 = grandTotal('p2');

    total1El.textContent = t1;
    total2El.textContent = t2;

    card1.classList.toggle('leading', t1 > t2);
    card2.classList.toggle('leading', t2 > t1);

    for (var i = 0; i < ROUNDS; i++){
      var card = document.getElementById('row-' + i);
      card.classList.toggle('active', i === state.activeRound);

      ['primary', 'secondary'].forEach(function(cat){
        ['p1', 'p2'].forEach(function(player){
          var input = card.querySelector('.stepper[data-player="' + player + '"][data-cat="' + cat + '"] input');
          if (document.activeElement !== input) input.value = state.scores[player][cat][i];
        });
      });

      var rt1 = roundTotal('p1', i);
      var rt2 = roundTotal('p2', i);
      document.getElementById('rtotal-' + i).innerHTML =
        '<span class="p1t">' + rt1 + '</span> &ndash; <span class="p2t">' + rt2 + '</span>';

      var overCap = state.scores.p1.primary[i] > CAT_CAP || state.scores.p2.primary[i] > CAT_CAP ||
                    state.scores.p1.secondary[i] > CAT_CAP || state.scores.p2.secondary[i] > CAT_CAP;
      var warnEl = document.getElementById('warn-' + i);
      warnEl.style.display = overCap ? 'block' : 'none';
      warnEl.textContent = 'Over the 15 VP/category guideline';
    }

    roundStatus.textContent = 'Round ' + (state.activeRound + 1) + ' of ' + ROUNDS;

    if (state.gameOver){
      winnerBanner.classList.add('show');
      if (t1 === t2){
        winnerBanner.textContent = 'Game Over — Draw (' + t1 + ' – ' + t2 + ')';
      } else {
        var winnerName = t1 > t2 ? document.getElementById('name1').value : document.getElementById('name2').value;
        winnerBanner.textContent = 'Game Over — ' + winnerName + ' wins (' + t1 + ' – ' + t2 + ')';
      }
    } else {
      winnerBanner.classList.remove('show');
    }
  }

  document.getElementById('prevBtn').addEventListener('click', function(){
    if (state.activeRound > 0){
      state.activeRound--;
      state.gameOver = false;
      render();
      scrollActiveIntoView();
      saveState();
    }
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    if (state.activeRound < ROUNDS - 1){
      state.activeRound++;
      render();
      scrollActiveIntoView();
    } else {
      state.gameOver = true;
      render();
      recordGameToHistory();
    }
    saveState();
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('Start a new game? This clears the current scores.')){
      return;
    }
    state.scores = {
      p1: { primary: new Array(ROUNDS).fill(0), secondary: new Array(ROUNDS).fill(0) },
      p2: { primary: new Array(ROUNDS).fill(0), secondary: new Array(ROUNDS).fill(0) }
    };
    state.activeRound = 0;
    state.gameOver = false;
    state.gameId = makeGameId();
    state.recorded = false;
    render();
    saveState();
  });

  function scrollActiveIntoView(){
    var row = document.getElementById('row-' + state.activeRound);
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  loadState();
  buildRounds();
  render();
})();
</script>
</body>
</html>
